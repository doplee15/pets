<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navbar with JS Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;
        }

        .nav{
            display:flex;
            align-items:center;
            gap:40px;
            font-size:small;
            list-style:none;
            padding:15px 40px;
            background:#222;
        }

        .nav a{
            color:white;
            text-decoration:none;
        }

        .nav a:hover{
            color:cyan;
        }

        .login-btn{
            padding:6px 14px;
            border:1px solid white;
            background:none;
            color:white;
            cursor:pointer;
        }

        .login-btn:hover{
            background:white;
            color:black;
        }

        .brand{
            font-size:x-large;
            margin-left:100px;
            color:white;
        }
    </style>
</head>

<body>

<ul class="nav">

    <li class="brand"><b>BV ARAVIND</b></li>

    <li class="nav-item">
        <a class="nav-link" href="new.html"><b>Home</b></a>
    </li>

    <li class="nav-item">
        <a class="nav-link" href="fff.html"><b>About</b></a>
    </li>

    <li class="nav-item">
        <a class="nav-link" href="./ser.html"><b>Services</b></a>
    </li>

    <li class="nav-item">
        <a class="nav-link" href="cont.html"><b>Contact</b></a>
    </li>

    <li class="nav-item">
        <a class="nav-link" href="shop.html"><b>Shop</b></a>
    </li>

    <li class="nav-item">
        <a href="shop.html">
            <img src="./img.html/shopping-cart.png" alt="" width="20px" height="20px">
        </a>
    </li>

    <!-- Login Button -->
    <li>
        <button class="login-btn" onclick="loginToggle()" id="loginBtn">
            Login
        </button>
    </li>

</ul>

<script>
    let isLoggedIn = false;

    function loginToggle(){
        const btn = document.getElementById("loginBtn");

        if(isLoggedIn === false){
            alert("Login Successful!");
            btn.innerText = "Logout";
            isLoggedIn = true;
        } else {
            alert("Logged Out Successfully!");
            btn.innerText = "Login";
            isLoggedIn = false;
        }
    }
</script>

</body>
</html>
